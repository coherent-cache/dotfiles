# AeroSpace Configuration
# Task desks: one workspace per task (dev, agents, work, research, home), plus Q (Talk) and E (Media).
# A desk holds a Rex window and the browser windows of that task. Names equal the Rex session names;
# 'home' holds the Rex sessions household, homelab and personal.

config-version = 2

# Keep the desks alive under the v2 empty-list default.
persistent-workspaces = ['dev', 'agents', 'work', 'research', 'home', 'Q', 'E']

# Available commands: https://nikitabobko.github.io/AeroSpace/commands
# desk-follow shows the browser window of the Rex session you select (see ~/.local/bin/desk-follow).
after-startup-command = ['exec-and-forget ~/.local/bin/desk-follow run']

# Start AeroSpace at login
start-at-login = true

auto-reload-config = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Disable macOS "Hide application" (cmd-h)
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*)
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = [
    { monitor."built-in" = 0 },
    10
]
outer.bottom = 10
outer.top = 10
outer.right = [
    { monitor."built-in" = 0 },
    10
]

# Workspace-to-monitor assignment removed to allow move-workspace-to-monitor
# to work freely. Apps still land on the correct workspace via on-window-detected
# rules below. Place workspaces on monitors manually with alt-shift-tab or
# alt-1..5 / alt-q / alt-e after startup.

# ============================================================================
# App auto-assignment rules
# ============================================================================

# Rex and Helium have no rule: each has one app id for all its windows, so a new window
# opens on the desk you are on. Move it with alt-shift-<desk key>.

# Q (Talk) - communication, meetings, notes
[[on-window-detected]]
if.app-name-regex-substring = 'WhatsApp'
run = 'move-node-to-workspace Q'

[[on-window-detected]]
if.app-name-regex-substring = 'Discord'
run = 'move-node-to-workspace Q'

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = 'move-node-to-workspace Q'

[[on-window-detected]]
if.app-name-regex-substring = 'Webex'
run = 'move-node-to-workspace Q'

[[on-window-detected]]
if.window-title-regex-substring = 'meet\.google\.com'
run = 'move-node-to-workspace Q'

[[on-window-detected]]
if.app-id = 'com.electron.logseq'
run = 'move-node-to-workspace Q'

# dev - editors and other terminals
[[on-window-detected]]
if.app-name-regex-substring = 'Zed'
run = 'move-node-to-workspace dev'

[[on-window-detected]]
if.app-name-regex-substring = 'Alacritty'
run = 'move-node-to-workspace dev'

[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
run = 'move-node-to-workspace dev'

[[on-window-detected]]
if.app-name-regex-substring = 'Cursor'
run = 'move-node-to-workspace dev'

[[on-window-detected]]
if.app-id = 'ai.opencode.desktop'
run = 'move-node-to-workspace dev'

# Finder always floating
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

# Thunderbird main-window titles vary with the active tab; float only known popups.
[[on-window-detected]]
if.app-id = 'org.mozilla.thunderbird'
if.window-title-regex-substring = 'Write: '
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.mozilla.thunderbird'
if.window-title-regex-substring = 'Logins - '
run = 'layout floating'

# Calendar reminder dialog: static title "Calendar Reminders", then "{n} Reminder(s)".
[[on-window-detected]]
if.app-id = 'org.mozilla.thunderbird'
if.window-title-regex-substring = '^(Calendar Reminders|[0-9]+ Reminders?)$'
run = 'layout floating'

# E (Media)
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace E'

[[on-window-detected]]
if.app-name-regex-substring = 'Logic Pro'
run = 'move-node-to-workspace E'

# ============================================================================
# Keybindings - Main mode
# ============================================================================
[mode.main.binding]
cmd-h = []      # Disable "hide application"
cmd-alt-h = []  # Disable "hide others"

# Layout
alt-slash = 'layout tiles accordion'
alt-comma = 'layout horizontal vertical'
alt-space = 'layout tiles accordion'

# Focus (IJKL)
alt-j = 'focus left'
alt-k = 'focus down'
alt-i = 'focus up'
alt-l = 'focus right'

# Move windows (IJKL)
alt-shift-j = 'move left'
alt-shift-k = 'move down'
alt-shift-i = 'move up'
alt-shift-l = 'move right'

# Swap windows (preserve layout)
alt-shift-comma = 'swap left'
alt-shift-period = 'swap right'

# Join with (IJKL)
alt-ctrl-j = 'join-with left'
alt-ctrl-k = 'join-with down'
alt-ctrl-i = 'join-with up'
alt-ctrl-l = 'join-with right'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Fullscreen
alt-f = 'fullscreen'

# Toggle floating
alt-shift-f = 'layout floating tiling'

# Float + center via Raycast (toggle float, then Raycast centers it)
alt-c = ['layout floating', 'exec-and-forget open raycast://extensions/raycast/window-management/center']


# Desks
alt-1 = 'workspace dev'
alt-2 = 'workspace agents'
alt-3 = 'workspace work'
alt-4 = 'workspace research'
alt-5 = 'workspace home'
alt-q = 'workspace Q'
alt-e = 'workspace E'

# Move window to desk and switch
alt-shift-1 = ['move-node-to-workspace dev', 'workspace dev']
alt-shift-2 = ['move-node-to-workspace agents', 'workspace agents']
alt-shift-3 = ['move-node-to-workspace work', 'workspace work']
alt-shift-4 = ['move-node-to-workspace research', 'workspace research']
alt-shift-5 = ['move-node-to-workspace home', 'workspace home']
alt-shift-q = ['move-node-to-workspace Q', 'workspace Q']
alt-shift-e = ['move-node-to-workspace E', 'workspace E']

# Move window to desk (stay on current)
alt-ctrl-shift-1 = 'move-node-to-workspace dev'
alt-ctrl-shift-2 = 'move-node-to-workspace agents'
alt-ctrl-shift-3 = 'move-node-to-workspace work'
alt-ctrl-shift-4 = 'move-node-to-workspace research'
alt-ctrl-shift-5 = 'move-node-to-workspace home'
alt-ctrl-shift-q = 'move-node-to-workspace Q'
alt-ctrl-shift-e = 'move-node-to-workspace E'

# Tie the focused browser window to the Rex session shown in this desk's Rex window
alt-shift-b = 'exec-and-forget ~/.local/bin/desk-follow tag'

# Workspace navigation
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Service mode
alt-shift-semicolon = 'mode service'

# ============================================================================
# Service mode
# ============================================================================
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']  # reset layout
f = ['layout floating tiling', 'mode main']  # toggle floating/tiling
backspace = ['close-all-windows-but-current', 'mode main']

# Volume controls
down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']
