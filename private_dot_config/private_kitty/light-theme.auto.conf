# vim:ft=kitty

## name:  GitHub Light-ish
## blurb: Clean off-white matching gnome-terminal (#FAFAFA); palette
##        readable on #fafafa.
## Applied automatically by kitty when the system theme is light.

# The basic colors
foreground             #1f1f1f
background             #fafafa
selection_foreground   #fafafa
selection_background   #1f1f1f

# Cursor colors
cursor                 #1f1f1f
cursor_text_color      #fafafa

# URL underline color when hovering with mouse
url_color              #0066cc

# Tab bar colors
active_tab_foreground   #fafafa
active_tab_background   #1f1f1f
inactive_tab_foreground #555555
inactive_tab_background #e6e6e6
tab_bar_background      #fafafa

# ANSI 16-color palette
color0  #24292e
color8  #6a737d
color1  #d73a49
color9  #cb2431
color2  #22863a
color10 #28a745
color3  #b08800
color11 #b08800
color4  #005cc5
color12 #0366d6
color5  #6f42c1
color13 #6f42c1
color6  #1b7c83
color14 #3192aa
color7  #6a737d
color15 #24292e
